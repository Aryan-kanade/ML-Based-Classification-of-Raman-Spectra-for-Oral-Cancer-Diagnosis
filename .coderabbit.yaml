# CodeRabbit configuration — ML-Based-Classification-of-Raman-Spectra
# Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
tone_instructions: >-
  Clinical-research codebase (PyQt Raman spectroscopy classifier for
  oral cancer screening). Patient privacy is paramount: never suggest
  committing data, logs, or filenames containing patient identifiers.
  Prefer minimal, surgical diffs that match the surrounding style.

early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  # Privacy / generated artifacts: never review, quote, or learn from
  # these (most are gitignored — belt and braces in case they appear)
  path_filters:
    - "!Data/**"
    - "!Documatation/**"
    - "!_external/**"
    - "!renders/**"
    - "!.zcode/**"
    - "!**/__pycache__/**"
    - "!**/*.joblib"
    - "!raman_app/session.log*"
    - "!raman_app/data_report.txt"
    - "!raman_app/result_report.*"
    - "!raman_app/study_run*/**"
    - "!raman_app/vit_outputs/**"
    - "!raman_app/bench/**"
    - "!raman_app/repro_out/**"
    - "!*.zip"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  tools:
    ruff:
      enabled: true

knowledge_base:
  opt_out: false
  learnings:
    scope: local
  code_guidelines:
    filePatterns:
      - "Brain.md"
      - "AGENTS.md"
