# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
language: "en-US"
tone_instructions: >-
  Clinical-research codebase (PyQt Raman spectroscopy classifier for
  oral cancer screening). Patient privacy is paramount: never suggest
  committing data, logs, or filenames containing patient identifiers.
  Prefer minimal, surgical diffs that match the surrounding style.

early_access: false

reviews:
  # balanced feedback; use "quiet" for critical-only, "assertive" for more
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false
  # Privacy / generated artifacts: never review, quote, or learn from
  # these (most are gitignored — belt and braces in case they appear)
  path_filters:
    - "!Data/**"                        # patient data — never
    - "!Documatation/**"
    - "!_external/**"
    - "!renders/**"
    - "!.zcode/**"
    - "!**/__pycache__/**"
    - "!**/*.joblib"
    - "!**/*.lock"
    - "!raman_app/model_*_card.md"      # auto-generated model cards
    - "!raman_app/session.log*"
    - "!raman_app/data_report.txt"
    - "!raman_app/result_report.*"
    - "!raman_app/study_run*/**"
    - "!raman_app/vit_outputs/**"
    - "!raman_app/bench/**"
    - "!raman_app/repro_out/**"
    - "!*.zip"
  auto_review:
    enabled: true
    auto_incremental_review: true   # re-run the review on each push
    drafts: false
    base_branches:
      - "main"
  tools:
    ruff:
      enabled: true

knowledge_base:
  opt_out: false
  learnings:
    scope: local
  code_guidelines:
    filePatterns:
      - "Brain.md"
      - "AGENTS.md"
